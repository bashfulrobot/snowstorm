name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # weekly, so newly published CVEs surface without a code change
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      - name: Verify vendored driver
        run: scripts/verify-vendored-gosnowflake.sh

  # Grype (via Syft) scans the compiled binary. A source scan reads go.sum,
  # which lists modules that are not compiled in (brotli, thrift) and floods
  # the report with false positives. The binary lists only what ships.
  # Fails on any high or critical finding that has a fix.
  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - run: go build -trimpath -o scan-target/snowstorm .
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: scan-target
          fail-build: true
          output-format: table
          severity-cutoff: high
          only-fixed: true

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [darwin/amd64, darwin/arm64, linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Build ${{ matrix.target }}
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" go build -trimpath -o /dev/null .
