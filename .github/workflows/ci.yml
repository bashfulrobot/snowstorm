name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # weekly, so newly published CVEs surface without a code change
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Verify vendored driver
        run: scripts/verify-vendored-gosnowflake.sh

  # Grype (via Syft) scans go.mod and go.sum dependencies against its
  # vulnerability database. Fails on any high or critical finding that has a fix.
  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: "."
          fail-build: true
          output-format: table
          severity-cutoff: high
          only-fixed: true

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [darwin/amd64, darwin/arm64, linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.target }}
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" go build -trimpath -o /dev/null .
